
name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t automated-deployment-backend:ci ./backend

      - name: Build frontend Docker image
        run: docker build -t automated-deployment-frontend:ci ./frontend

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: automated-deployment-backend:ci
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: automated-deployment-frontend:ci
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

        
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push backend image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag automated-deployment-backend:ci \
            "$DOCKERHUB_USERNAME/automated-application-deployment-backend:latest"
          docker tag automated-deployment-backend:ci \
            "$DOCKERHUB_USERNAME/automated-application-deployment-backend:$IMAGE_TAG"
          docker push "$DOCKERHUB_USERNAME/automated-application-deployment-backend:latest"
          docker push "$DOCKERHUB_USERNAME/automated-application-deployment-backend:$IMAGE_TAG"

      - name: Push frontend image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag automated-deployment-frontend:ci \
            "$DOCKERHUB_USERNAME/automated-application-deployment-frontend:latest"
          docker tag automated-deployment-frontend:ci \
            "$DOCKERHUB_USERNAME/automated-application-deployment-frontend:$IMAGE_TAG"
          docker push "$DOCKERHUB_USERNAME/automated-application-deployment-frontend:latest"
          docker push "$DOCKERHUB_USERNAME/automated-application-deployment-frontend:$IMAGE_TAG"

