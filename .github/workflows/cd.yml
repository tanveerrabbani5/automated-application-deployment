name: CD - Deploy Application to AWS EC2

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::742851379229:role/Auto-App-deployment-Role
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Deploy application to EC2
        run: |
          INSTANCE_ID="i-06dfaf8454dc5cc9e"

          echo "Deploying to EC2 instance: $INSTANCE_ID"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /home/ubuntu",
              "docker pull tanveer7docker/automated-application-deployment-backend:latest",
              "docker pull tanveer7docker/automated-application-deployment-frontend:latest",
              "docker stop deployment-backend deployment-frontend || true",
              "docker rm deployment-backend deployment-frontend || true",
              "docker run -d --name deployment-backend --restart unless-stopped -e NODE_ENV=production -e PORT=3000 tanveer7docker/automated-application-deployment-backend:latest",
              "docker run -d --name deployment-frontend --restart unless-stopped -p 80:80 tanveer7docker/automated-application-deployment-frontend:latest",
              "docker ps"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          echo "Deployment result:"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output table